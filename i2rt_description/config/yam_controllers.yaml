controller_manager:
  ros__parameters:
    # Matches CONTROL_FREQ in i2rt/motor_drivers/dm_driver.py — read()/write()
    # run on controller_manager's own thread at this rate since the hardware
    # component isn't marked async.
    update_rate: 250

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    # gripper_joint has no ros2_control command/state interface yet (see
    # big_yam_ros2_control.xacro's comment: no calibration/remapping ported
    # for motor 7), so this controller can't actually be activated until
    # that's added. Declared now so the MoveIt-side wiring (moveit_
    # controllers.yaml, i2rt.srdf's "gripper" group, demo.launch.py's
    # spawner) is ready to test as soon as it is.
    gripper_controller:
      type: position_controllers/GripperActionController

joint_trajectory_controller:
  ros__parameters:
    # gripper_joint intentionally excluded — it's driven by gripper_controller
    # (below) instead, matching the separate "gripper" SRDF group.
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    allow_nonzero_velocity_at_trajectory_end: true
    # MoveIt's "arm" planning group only covers joint1-6 (gripper is a
    # separate SRDF group), so its FollowJointTrajectory goals never include
    # gripper_joint. Without this, the controller rejects any goal that
    # doesn't command every joint it owns (default false) - plan preview
    # works, execute silently does nothing.
    allow_partial_joints_goal: true

gripper_controller:
  ros__parameters:
    # Single actuated joint; gripper_mimic_joint (the other finger) is not
    # listed — it follows via the URDF's <mimic> tag, not a separate
    # ros2_control interface (see gripper_linear_4310.xacro).
    joint: gripper_joint
    allow_stalling: true
    stall_velocity_threshold: 0.001
    stall_timeout: 1.0
    action_monitor_rate: 20.0
