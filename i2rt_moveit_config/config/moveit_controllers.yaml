/**:
  ros__parameters:
    moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

    moveit_simple_controller_manager:
      controller_names:
        - joint_trajectory_controller
        - gripper_controller

      joint_trajectory_controller:
        type: FollowJointTrajectory
        action_ns: follow_joint_trajectory
        default: true
        joints:
          - joint1
          - joint2
          - joint3
          - joint4
          - joint5
          - joint6

      # Matches gripper_controller (position_controllers/GripperActionController)
      # in yam_controllers.yaml. Registered here alongside
      # joint_trajectory_controller so the "arm_gripper" SRDF group (see
      # i2rt.srdf) can command all 7 joints in one plan/execute -
      # moveit_simple_controller_manager automatically splits the resulting
      # trajectory across whichever of these controllers together cover it.
      gripper_controller:
        type: GripperCommand
        action_ns: gripper_cmd
        default: true
        joints:
          - gripper_joint
