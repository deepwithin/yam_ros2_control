/**:
  ros__parameters:
    moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

    moveit_simple_controller_manager:
      controller_names:
        - joint_trajectory_controller
        - gripper_controller

      joint_trajectory_controller:
        type: FollowJointTrajectory
        action_ns: follow_joint_trajectory
        default: true
        joints:
          - joint1
          - joint2
          - joint3
          - joint4
          - joint5
          - joint6

      # Matches gripper_controller (position_controllers/GripperActionController)
      # in yam_controllers.yaml. gripper_joint has no ros2_control interface
      # yet (see big_yam_ros2_control.xacro's comment: no calibration/
      # remapping ported for motor 7), so this controller can't actually be
      # activated until that's added — wired up now so the rest of the
      # MoveIt gripper path is ready to test as soon as it is.
      gripper_controller:
        type: GripperCommand
        action_ns: gripper_cmd
        default: true
        joints:
          - gripper_joint
